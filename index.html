<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1f" />
  <meta
    name="description"
    content="A private mood-repair experience designed for one specific person."
    id="metaDescription"
  />
  <meta property="og:title" content="Classified Mood Repair Protocol" id="metaOgTitle" />
  <meta
    property="og:description"
    content="A polished secret-file surprise with a soft interactive reveal."
    id="metaOgDescription"
  />
  <meta property="og:type" content="website" />
  <title>Classified Mood Repair Protocol</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101d;
      --bg-deep: #040914;
      --bg-ink: #0b1424;
      --panel: rgba(11, 21, 38, 0.72);
      --panel-strong: rgba(17, 29, 49, 0.9);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f8f5ef;
      --muted: rgba(239, 233, 223, 0.75);
      --accent: #8ee3d1;
      --accent-2: #f6c47d;
      --accent-3: #adc2ff;
      --danger-soft: rgba(255, 111, 126, 0.22);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --transition: 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
      --transition-slow: 560ms cubic-bezier(0.16, 1, 0.3, 1);
      --font-ui: "SF Pro Display", "SF Arabic", "Noto Sans Arabic", "Segoe UI",
        "Tahoma", "Geeza Pro", system-ui, sans-serif;
      --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua",
        "Noto Naskh Arabic", "Geeza Pro", serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      background:
        radial-gradient(circle at top, rgba(142, 227, 209, 0.14), transparent 26%),
        radial-gradient(circle at 80% 10%, rgba(246, 196, 125, 0.12), transparent 22%),
        linear-gradient(160deg, var(--bg-deep), var(--bg));
      color: var(--text);
      font-family: var(--font-ui);
      overflow-x: hidden;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100svh;
      position: relative;
      overscroll-behavior-y: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(70px);
      opacity: 0.6;
      animation: drift 16s ease-in-out infinite alternate;
    }

    body::before {
      width: 42vw;
      height: 42vw;
      top: 8%;
      left: -10%;
      background: rgba(142, 227, 209, 0.13);
    }

    body::after {
      width: 46vw;
      height: 46vw;
      bottom: -10%;
      right: -12%;
      background: rgba(246, 196, 125, 0.12);
      animation-duration: 20s;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(5vw, -3vw, 0) scale(1.08);
      }
    }

    .ambient-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 92%);
      pointer-events: none;
      opacity: 0.35;
    }

    .particle-layer,
    .sparkle-layer,
    .toast {
      pointer-events: none;
    }

    .particle-layer,
    .sparkle-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85), transparent 70%);
      opacity: 0;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% {
        transform: translate3d(0, 14px, 0) scale(0.7);
        opacity: 0;
      }
      15% {
        opacity: 0.45;
      }
      85% {
        opacity: 0.15;
      }
      100% {
        transform: translate3d(0, -110vh, 0) scale(1.12);
        opacity: 0;
      }
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.95) 0 18%, transparent 20%),
        linear-gradient(0deg, transparent 0 42%, rgba(255, 255, 255, 0.75) 43% 57%, transparent 58%),
        linear-gradient(90deg, transparent 0 42%, rgba(255, 255, 255, 0.75) 43% 57%, transparent 58%);
      transform: scale(0);
      opacity: 0;
      animation: sparkleBurst 1300ms ease-out forwards;
    }

    @keyframes sparkleBurst {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.2) rotate(0deg);
      }
      25% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--dx), var(--dy), 0) scale(1.55) rotate(220deg);
      }
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      position: relative;
    }

    .screen {
      display: none;
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      transition: opacity 420ms ease, transform 420ms ease;
      will-change: opacity, transform;
    }

    .screen.active {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .screen.active .panel {
      animation: panelEnter 780ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes panelEnter {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .panel {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 28%),
        var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      isolation: isolate;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 32%);
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: -120% auto auto -30%;
      width: 45%;
      height: 240%;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.11), transparent);
      transform: rotate(22deg);
      opacity: 0.45;
      pointer-events: none;
      animation: panelSweep 10s linear infinite;
    }

    @keyframes panelSweep {
      0%,
      18% {
        transform: translate3d(-120%, 0, 0) rotate(22deg);
        opacity: 0;
      }
      28% {
        opacity: 0.42;
      }
      42%,
      100% {
        transform: translate3d(340%, 0, 0) rotate(22deg);
        opacity: 0;
      }
    }

    .label-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    .classified-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: rgba(246, 196, 125, 0.88);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .classified-line::before,
    .classified-line::after {
      content: "";
      width: 26px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(246, 196, 125, 0.65));
    }

    .label-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px rgba(142, 227, 209, 0.55);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .hero-title,
    .section-title,
    .result-title {
      line-height: 1.18;
      font-weight: 700;
      font-family: var(--font-display);
    }

    .hero-title {
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      margin-bottom: 16px;
      text-wrap: balance;
      letter-spacing: 0.01em;
    }

    .hero-title .accent,
    .result-title .accent {
      color: var(--accent-2);
      text-shadow: 0 0 22px rgba(246, 196, 125, 0.18);
    }

    .hero-subtitle,
    .section-copy,
    .result-copy,
    .note {
      color: var(--muted);
      line-height: 1.85;
      font-size: 1.01rem;
    }

    .hero-panel {
      min-height: min(78svh, 720px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }

    .screen.active .hero-panel > * {
      animation: heroRise 860ms var(--transition-slow) both;
    }

    .screen.active .hero-panel > :last-child {
      animation-delay: 110ms;
    }

    .screen.active .hero-badge {
      animation: heroRise 860ms var(--transition-slow) both;
    }

    .screen.active .hero-badge:nth-child(1) {
      animation-delay: 120ms;
    }

    .screen.active .hero-badge:nth-child(2) {
      animation-delay: 180ms;
    }

    .screen.active .hero-badge:nth-child(3) {
      animation-delay: 240ms;
    }

    .screen.active .hero-badge:nth-child(4) {
      animation-delay: 300ms;
    }

    @keyframes heroRise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-badge-grid {
      display: grid;
      gap: 10px;
      margin-top: 24px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .hero-badge {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 60%),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--muted);
      font-size: 0.92rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .hero-badge strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      appearance: none;
      border: 0;
      outline: 0;
      cursor: pointer;
      font: inherit;
      touch-action: manipulation;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition), background var(--transition), border-color var(--transition);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible {
      box-shadow: 0 0 0 2px rgba(7, 16, 29, 0.88), 0 0 0 4px rgba(246, 196, 125, 0.46);
    }

    .primary-btn,
    .secondary-btn,
    .ghost-btn {
      min-height: 54px;
      border-radius: 18px;
      padding: 0 18px;
      font-weight: 700;
    }

    .primary-btn {
      min-width: 150px;
      color: #08121d;
      background: linear-gradient(135deg, var(--accent-2), #f6d9a0 55%, #fff4da);
      box-shadow: 0 14px 34px rgba(246, 196, 125, 0.24);
      position: relative;
      overflow: hidden;
    }

    .primary-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 18%, rgba(255, 255, 255, 0.55) 48%, transparent 74%);
      transform: translateX(-140%);
      transition: transform 900ms ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(246, 196, 125, 0.28);
    }

    .primary-btn:hover::before {
      transform: translateX(140%);
    }

    .primary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .secondary-btn {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ghost-btn {
      color: var(--muted);
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.12);
    }

    .section-head {
      margin-bottom: 18px;
    }

    .section-title {
      font-size: clamp(1.7rem, 5.6vw, 2.2rem);
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }

    .question-group + .question-group {
      margin-top: 18px;
    }

    .question-card {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.09);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 44%),
        rgba(255, 255, 255, 0.03);
      padding: 16px;
    }

    .question-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .question-label h3 {
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .counter-chip {
      flex-shrink: 0;
      min-width: 44px;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(142, 227, 209, 0.08);
      color: var(--accent);
      border: 1px solid rgba(142, 227, 209, 0.16);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .option-btn {
      position: relative;
      text-align: right;
      min-height: 104px;
      padding: 16px 16px 16px 42px;
      border-radius: var(--radius-md);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 38%),
        rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      overflow: hidden;
      transform: translateY(0) scale(1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition:
        transform var(--transition-slow),
        box-shadow var(--transition-slow),
        background var(--transition),
        border-color var(--transition),
        filter var(--transition);
      will-change: transform;
    }

    .option-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.1), transparent 35%, transparent 70%, rgba(255, 255, 255, 0.08));
      opacity: 0;
      transition: opacity var(--transition);
    }

    .option-btn::after {
      content: "";
      position: absolute;
      inset: auto -30% -45% auto;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12), transparent 70%);
      transition: opacity var(--transition), transform var(--transition);
      opacity: 0;
      transform: scale(0.7);
    }

    .option-btn:hover::after,
    .option-btn.selected::after {
      opacity: 1;
      transform: scale(1);
    }

    .option-btn:hover,
    .option-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(2, 6, 14, 0.22);
    }

    .option-btn:hover::before,
    .option-btn.selected::before {
      opacity: 1;
    }

    .option-btn.selected {
      border-color: rgba(246, 196, 125, 0.45);
      background:
        linear-gradient(135deg, rgba(246, 196, 125, 0.18), rgba(142, 227, 209, 0.12)),
        rgba(255, 255, 255, 0.055);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 18px 34px rgba(0, 0, 0, 0.22);
      transform: translateY(-4px) scale(1.01);
    }

    .option-btn .emoji {
      font-size: 1.25rem;
      display: inline-block;
      margin-bottom: 8px;
    }

    .option-btn .title {
      display: block;
      font-weight: 700;
      font-size: 0.97rem;
      margin-bottom: 4px;
    }

    .option-btn .desc {
      display: block;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .option-check {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .option-check::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-2), #fff0cf);
      opacity: 0;
      transform: scale(0.4);
      transition: transform var(--transition), opacity var(--transition);
    }

    .option-btn.selected .option-check::after {
      opacity: 1;
      transform: scale(1);
    }

    .helper-card {
      margin-top: 16px;
      padding: 15px 16px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(142, 227, 209, 0.09), rgba(173, 194, 255, 0.08));
      border: 1px solid rgba(142, 227, 209, 0.12);
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.7;
    }

    .processing-panel,
    .result-panel {
      min-height: min(78svh, 720px);
    }

    .processing-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .processing-visual {
      display: grid;
      place-items: center;
      margin: 4px 0 8px;
    }

    .scanner-core {
      --progress-angle: 0deg;
      position: relative;
      width: min(60vw, 220px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(7, 16, 29, 0.96) 0 53%, transparent 54%),
        conic-gradient(
          from -90deg,
          rgba(246, 196, 125, 0.95) 0deg,
          rgba(142, 227, 209, 0.9) var(--progress-angle),
          rgba(255, 255, 255, 0.09) var(--progress-angle),
          rgba(255, 255, 255, 0.09) 360deg
        );
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        0 26px 60px rgba(2, 7, 18, 0.42),
        0 0 28px rgba(142, 227, 209, 0.12);
    }

    .scanner-core::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.09), rgba(8, 17, 31, 0.88) 68%);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.26);
    }

    .scanner-core::after {
      content: "";
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      border: 1px solid rgba(246, 196, 125, 0.18);
      opacity: 0.5;
      animation: scannerRotate 6s linear infinite;
    }

    @keyframes scannerRotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .scanner-center {
      position: relative;
      z-index: 1;
      width: 72%;
      text-align: center;
    }

    .scanner-value {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 9vw, 3.7rem);
      line-height: 1;
      color: #fff7e3;
      text-shadow: 0 0 24px rgba(246, 196, 125, 0.18);
    }

    .scanner-caption {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .processing-stage-rail {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stage-pill {
      min-height: 52px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(239, 233, 223, 0.62);
      font-size: 0.8rem;
      line-height: 1.45;
      transition: transform var(--transition), background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .stage-pill.active {
      color: var(--text);
      background: linear-gradient(135deg, rgba(246, 196, 125, 0.16), rgba(142, 227, 209, 0.12));
      border-color: rgba(246, 196, 125, 0.28);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
      transform: translateY(-2px);
    }

    .progress-shell {
      margin: 12px 0 2px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-bar {
      width: 0;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), #ffe9c1);
      box-shadow: 0 0 26px rgba(142, 227, 209, 0.35);
      transition: width 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .processing-log {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    .log-line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--muted);
      transform: translateY(10px);
      opacity: 0;
      animation: logAppear 360ms ease forwards;
    }

    .log-line::before {
      content: "";
      width: 10px;
      height: 10px;
      margin-top: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px rgba(246, 196, 125, 0.35);
    }

    @keyframes logAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(142, 227, 209, 0.3);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(142, 227, 209, 0.35);
      }
      70% {
        box-shadow: 0 0 0 14px rgba(142, 227, 209, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(142, 227, 209, 0);
      }
    }

    .result-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .result-card {
      position: relative;
      overflow: hidden;
      border-radius: calc(var(--radius-xl) - 4px);
      padding: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), transparent 26%),
        linear-gradient(160deg, rgba(246, 196, 125, 0.14), rgba(142, 227, 209, 0.11), rgba(173, 194, 255, 0.09));
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        0 28px 70px rgba(0, 0, 0, 0.26);
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: auto -10% -48% auto;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 65%);
    }

    .result-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.14) 45%, transparent 70%);
      transform: translateX(-130%);
      animation: resultSheen 1800ms ease 240ms forwards;
      pointer-events: none;
    }

    @keyframes resultSheen {
      to {
        transform: translateX(130%);
      }
    }

    .result-eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 247, 227, 0.84);
      font-size: 0.82rem;
      letter-spacing: 0.03em;
    }

    .result-title {
      font-size: clamp(2rem, 6.2vw, 2.8rem);
      margin-bottom: 12px;
    }

    .result-copy {
      font-size: 1.05rem;
    }

    .result-copy-lead {
      color: #fffaf2;
      font-size: 1.14rem;
      line-height: 1.95;
      margin-bottom: 10px;
    }

    .result-copy strong {
      color: #fff7e3;
      font-weight: 700;
    }

    .result-highlight {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(6, 14, 25, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: rgba(248, 245, 239, 0.92);
      line-height: 1.8;
    }

    .signature-line {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 1.03rem;
      line-height: 1.8;
    }

    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .result-tag {
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 0.92rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translate(-50%, 24px);
      width: min(calc(100% - 28px), 420px);
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(11, 21, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity var(--transition), transform var(--transition);
      z-index: 50;
      text-align: center;
      color: var(--text);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      color: rgba(239, 233, 223, 0.56);
      font-size: 0.86rem;
    }

    .result-panel .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (max-width: 420px) {
      .panel {
        padding: 18px;
      }

      .hero-badge-grid,
      .options-grid {
        grid-template-columns: 1fr;
      }

      .processing-stage-rail,
      .result-panel .button-row {
        grid-template-columns: 1fr;
      }

      .option-btn {
        min-height: 96px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

          (badge) => `
            <div class="hero-badge">
              <strong>${badge.label}</strong>
              ${badge.body}
            </div>
          `
        )
        .join("");
    }

    function renderQuestions() {
      elements.questionGroups.innerHTML = COPY.choices.questions
        .map(
          (question) => `
            <section class="question-group">
              <div class="question-card">
                <div class="question-label">
                  <h3>${question.title}</h3>
                  <span class="counter-chip">${question.counter}</span>
                </div>
                <div class="options-grid">
                  ${question.options
                    .map(
                      (option) => `
                        <button
                          class="option-btn"
                          type="button"
                          data-group="${question.key}"
                          data-value="${option.title}"
                          aria-pressed="false"
                        >
                          <span class="option-check" aria-hidden="true"></span>
                          <span class="emoji" aria-hidden="true">${option.emoji}</span>
                          <span class="title">${option.title}</span>
                          <span class="desc">${option.desc}</span>
                        </button>
                      `
                    )
                    .join("")}
                </div>
              </div>
            </section>
          `
        )
        .join("");
    }

    function renderProcessingStages() {
      elements.processingStages.innerHTML = COPY.processing.stages
        .map((stage, index) => `<div class="stage-pill" data-stage="${index}">${stage}</div>`)
        .join("");
    }

    function bindQuestionEvents() {
      elements.questionGroups.addEventListener("click", (event) => {
        const button = event.target.closest(".option-btn");
        if (!button) return;

        const group = button.dataset.group;
        const value = button.dataset.value;
        state.selections[group] = value;

        document.querySelectorAll(`.option-btn[data-group="${group}"]`).forEach((option) => {
          const isSelected = option === button;
          option.classList.toggle("selected", isSelected);
          option.setAttribute("aria-pressed", String(isSelected));
        });

        updateProcessButton();
      });
    }

    function updateProcessButton() {
      const selectedCount = Object.values(state.selections).filter(Boolean).length;
      const totalQuestions = COPY.choices.questions.length;
      const remaining = totalQuestions - selectedCount;

      elements.processBtn.disabled = selectedCount !== totalQuestions;
      elements.helperText.textContent =
        remaining === 0
          ? COPY.choices.helperReady
          : formatText(COPY.choices.helperPending, { remaining });
    }

    function showScreen(targetId) {
      screenIds.forEach((id) => {
        const screen = document.getElementById(id);
        screen.classList.toggle("active", id === targetId);
      });
    }

    function clearProcessingTimers() {
      state.processingTimers.forEach((timer) => clearTimeout(timer));
      state.processingTimers = [];
    }

    function setProcessingProgress(progress) {
      elements.progressBar.style.width = `${progress}%`;
      elements.progressValue.textContent = `${progress}%`;
      elements.progressValueLarge.textContent = `${progress}%`;
      elements.scannerCore.style.setProperty("--progress-angle", `${(progress / 100) * 360}deg`);
    }

    function setActiveStage(stageIndex) {
      document.querySelectorAll(".stage-pill").forEach((pill) => {
        pill.classList.toggle("active", Number(pill.dataset.stage) === stageIndex);
      });
    }

    function resetProcessingVisual() {
      elements.processingLog.innerHTML = "";
      elements.processingStatus.textContent = COPY.processing.bootStatus;
      elements.processingMode.textContent = COPY.processing.modeLabel;
      elements.processingOrbitalLabel.textContent = COPY.processing.orbitalLabel;
      setProcessingProgress(0);
      setActiveStage(-1);
    }

    function startProcessing() {
      clearProcessingTimers();
      resetProcessingVisual();
      showScreen("processingScreen");

      COPY.processing.sequence.forEach((entry, index) => {
        const timer = setTimeout(() => {
          elements.processingStatus.textContent = entry.status;
          elements.processingOrbitalLabel.textContent = entry.orbital;
          setProcessingProgress(entry.progress);
          setActiveStage(entry.stage);

          const line = document.createElement("div");
          line.className = "log-line";
          line.textContent = entry.log;
          elements.processingLog.appendChild(line);
        }, index * 920);

        state.processingTimers.push(timer);
      });

      const finishTimer = setTimeout(() => {
        buildResult();
        showScreen("resultScreen");
        triggerSparkles();
      }, COPY.processing.sequence.length * 920 + 420);

      state.processingTimers.push(finishTimer);
    }

    function buildResult() {
      const moodFix = state.selections.moodFix;
      const place = state.selections.place;
      const comfort = state.selections.comfort;
      const nameInline = getRecipientName();
      const jokeLine = COPY.profile.insideJokeLine
        ? `<br /><br />${COPY.profile.insideJokeLine}`
        : "";

      elements.resultLead.innerHTML = formatText(COPY.result.leadTemplate, {
        nameInline,
        moodFix,
        place,
        comfort
      });
      elements.resultText.innerHTML = `${COPY.result.bodyTemplate}${jokeLine}`;
      elements.resultHighlight.innerHTML = formatText(COPY.result.highlightTemplate, {
        moodFix,
        place,
        comfort
      });
      elements.signatureLine.textContent = COPY.result.signature;
      elements.resultTags.innerHTML = [moodFix, place, comfort]
        .map((tag) => `<span class="result-tag">${tag}</span>`)
        .join("");
    }

    async function shareResult() {
      const tags = Object.values(state.selections).filter(Boolean).join(" • ");
      const text = [
        COPY.result.shareTitle,
        "",
        elements.resultLead.textContent.trim(),
        elements.resultText.textContent.trim(),
        elements.resultHighlight.textContent.trim(),
        "",
        elements.signatureLine.textContent.trim(),
        "",
        tags
      ].join("\n");

      if (navigator.share) {
        try {
          await navigator.share({
            title: COPY.result.shareTitle,
            text
          });
          return;
        } catch (error) {
          if (error && error.name === "AbortError") return;
        }
      }

      try {
        await navigator.clipboard.writeText(text);
        showToast(COPY.result.shareFallback);
      } catch (error) {
        showToast(COPY.result.manualCopyFallback);
      }
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        elements.toast.classList.remove("show");
      }, 2400);
    }

    function resetExperience() {
      clearProcessingTimers();
      state.selections = {
        moodFix: null,
        place: null,
        comfort: null
      };
      document.querySelectorAll(".option-btn").forEach((button) => {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
      });
      resetProcessingVisual();
      updateProcessButton();
      showScreen("introScreen");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function triggerSparkles() {
      const total = 30;
      const rect = elements.resultCard.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height * 0.28;

      elements.sparkleLayer.innerHTML = "";

      for (let index = 0; index < total; index += 1) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.left = `${centerX}px`;
        sparkle.style.top = `${centerY}px`;
        sparkle.style.setProperty("--dx", `${(Math.random() - 0.5) * 220}px`);
        sparkle.style.setProperty("--dy", `${-40 - Math.random() * 170}px`);
        sparkle.style.animationDelay = `${index * 28}ms`;
        elements.sparkleLayer.appendChild(sparkle);
      }

      setTimeout(() => {
        elements.sparkleLayer.innerHTML = "";
      }, 1900);
    }

    function createParticles() {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const particleCount = reducedMotion ? 8 : 16;
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < particleCount; index += 1) {
        const particle = document.createElement("span");
        const size = 2 + Math.random() * 4;
        particle.className = "particle";
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.bottom = `${-10 - Math.random() * 80}px`;
        particle.style.animationDuration = `${12 + Math.random() * 12}s`;
        particle.style.animationDelay = `${Math.random() * 12}s`;
        fragment.appendChild(particle);
      }

      elements.particleLayer.appendChild(fragment);
    }

    elements.startBtn.addEventListener("click", () => showScreen("choicesScreen"));
    elements.backBtn.addEventListener("click", () => showScreen("introScreen"));
    elements.processBtn.addEventListener("click", startProcessing);
    elements.restartBtn.addEventListener("click", resetExperience);
    elements.shareBtn.addEventListener("click", shareResult);

    applyHeadCopy();
    applyCopy();
    renderQuestions();
    bindQuestionEvents();
    updateProcessButton();
    resetProcessingVisual();
    createParticles();
  </script>
</body>
</html>
