<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <meta name="description" content="تجربة رقمية هادية ومصممة مخصوص لدنيا." id="metaDescription" />
  <meta property="og:title" content="إشارة من دنيا القادمة" id="metaOgTitle" />
  <meta property="og:description" content="ملف خاص جدًا معمول علشان دنيا تاخد نَفَس ومساحة وهدوء." id="metaOgDescription" />
  <meta property="og:type" content="website" />
  <title id="pageTitle">إشارة من دنيا القادمة</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #06101b;
      --bg-2: #091a2b;
      --bg-3: #0d2340;
      --panel: rgba(8, 18, 34, 0.62);
      --panel-strong: rgba(10, 23, 40, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --line-soft: rgba(255, 255, 255, 0.06);
      --text: #f7f4ee;
      --muted: rgba(231, 226, 218, 0.72);
      --accent: #82d9d2;
      --accent-soft: rgba(130, 217, 210, 0.18);
      --gold: #f3c78c;
      --gold-soft: rgba(243, 199, 140, 0.18);
      --rose: #f1aeb7;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.34);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --ease-soft: cubic-bezier(0.16, 1, 0.3, 1);
      --font-ui: "SF Pro Display", "SF Arabic", "Segoe UI", "Tahoma", "Noto Sans Arabic", sans-serif;
      --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Geeza Pro", "Noto Naskh Arabic", serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(130, 217, 210, 0.18), transparent 24%),
        radial-gradient(circle at 80% 0%, rgba(243, 199, 140, 0.14), transparent 22%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 45%, #071523);
      color: var(--text);
      font-family: var(--font-ui);
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      position: relative;
      overscroll-behavior-y: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
      animation: driftGlow 20s ease-in-out infinite alternate;
    }

    body::before {
      width: 44vw;
      height: 44vw;
      top: 6%;
      left: -12%;
      background: rgba(130, 217, 210, 0.14);
    }

    body::after {
      width: 52vw;
      height: 52vw;
      right: -18%;
      bottom: -12%;
      background: rgba(243, 199, 140, 0.12);
      animation-duration: 24s;
    }

    @keyframes driftGlow {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(5vw, -3vw, 0) scale(1.08);
      }
    }

    .ambient-grid,
    .particle-layer,
    .glow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 28%, transparent 92%);
      opacity: 0.34;
    }

    .glow-layer::before,
    .glow-layer::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.18;
    }

    .glow-layer::before {
      width: 34vh;
      height: 34vh;
      left: 8%;
      top: 36%;
      background: rgba(130, 217, 210, 0.34);
    }

    .glow-layer::after {
      width: 28vh;
      height: 28vh;
      right: 10%;
      top: 22%;
      background: rgba(243, 199, 140, 0.3);
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9), transparent 72%);
      opacity: 0;
      animation: riseParticle linear infinite;
    }

    @keyframes riseParticle {
      0% {
        transform: translateY(24px) scale(0.6);
        opacity: 0;
      }
      10% {
        opacity: 0.34;
      }
      80% {
        opacity: 0.12;
      }
      100% {
        transform: translateY(-110vh) scale(1.1);
        opacity: 0;
      }
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(100%, 620px);
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hud {
      position: sticky;
      top: max(10px, env(safe-area-inset-top));
      z-index: 5;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 24px;
      background: rgba(7, 16, 30, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .hud-mark {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.42), transparent 36%),
        linear-gradient(135deg, rgba(243, 199, 140, 0.28), rgba(130, 217, 210, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .hud-copy {
      min-width: 0;
    }

    .hud-title {
      font-family: var(--font-display);
      font-size: 1rem;
      margin-bottom: 2px;
      color: #fff7ea;
    }

    .hud-subtitle {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .hud-progress {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 2px;
      scrollbar-width: none;
    }

    .hud-progress::-webkit-scrollbar {
      display: none;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      transition: transform 320ms var(--ease), background 320ms var(--ease), box-shadow 320ms var(--ease);
    }

    .progress-dot.is-active {
      background: linear-gradient(135deg, var(--gold), #fff2d8);
      box-shadow: 0 0 18px rgba(243, 199, 140, 0.34);
      transform: scale(1.14);
    }

    .progress-dot.is-done {
      background: rgba(130, 217, 210, 0.38);
      box-shadow: 0 0 14px rgba(130, 217, 210, 0.22);
    }

    .view-frame {
      position: relative;
      flex: 1;
      display: flex;
    }

    .view {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: viewIn 720ms var(--ease-soft);
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(26px) scale(0.98);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .screen-card {
      position: relative;
      width: 100%;
      min-height: min(78svh, 900px);
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 26%),
        var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .screen-card::before,
    .screen-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .screen-card::before {
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 36%);
    }

    .screen-card::after {
      width: 45%;
      height: 240%;
      top: -82%;
      left: -24%;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transform: rotate(24deg);
      opacity: 0.38;
      animation: sheen 12s linear infinite;
    }

    @keyframes sheen {
      0%,
      14% {
        transform: translateX(-160%) rotate(24deg);
        opacity: 0;
      }
      22% {
        opacity: 0.4;
      }
      36%,
      100% {
        transform: translateX(320%) rotate(24deg);
        opacity: 0;
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 18px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--accent));
      box-shadow: 0 0 12px rgba(243, 199, 140, 0.3);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .display-title,
    .section-title,
    .final-title {
      font-family: var(--font-display);
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    .display-title {
      font-size: clamp(2.5rem, 10vw, 4.3rem);
      margin-bottom: 16px;
      text-wrap: balance;
    }

    .section-title,
    .final-title {
      font-size: clamp(1.9rem, 6vw, 2.7rem);
      margin-bottom: 12px;
      text-wrap: balance;
    }

    .accent {
      color: #fff0d3;
      text-shadow: 0 0 24px rgba(243, 199, 140, 0.24);
    }

    .copy,
    .soft-copy,
    .module-copy,
    .message-text {
      color: var(--muted);
      line-height: 1.9;
      font-size: 1rem;
    }

    .soft-copy {
      font-size: 0.94rem;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      color: inherit;
      touch-action: manipulation;
      transition:
        transform 300ms var(--ease),
        box-shadow 300ms var(--ease),
        background 300ms var(--ease),
        border-color 300ms var(--ease),
        opacity 300ms var(--ease);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(7, 16, 29, 0.9), 0 0 0 4px rgba(243, 199, 140, 0.38);
    }

    .btn,
    .btn-soft,
    .btn-ghost {
      min-height: 56px;
      padding: 0 20px;
      border-radius: 18px;
      font-weight: 700;
      position: relative;
      overflow: hidden;
    }

    .btn {
      color: #09111d;
      background: linear-gradient(135deg, var(--gold), #f9dfb5 58%, #fff4df);
      box-shadow: 0 18px 40px rgba(243, 199, 140, 0.26);
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 18%, rgba(255, 255, 255, 0.48) 46%, transparent 72%);
      transform: translateX(-140%);
      transition: transform 900ms ease;
    }

    .btn:hover::before {
      transform: translateX(140%);
    }

    .btn-soft {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.14);
    }

    .btn:disabled,
    .btn-soft:disabled,
    .btn-ghost:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
      margin: 8px 0;
    }

    .hero-layout,
    .section-layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: min(70svh, 800px);
      gap: 24px;
    }

    .hero-orb {
      position: absolute;
      inset: auto auto 10% -6%;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.22), transparent 32%),
        linear-gradient(140deg, rgba(130, 217, 210, 0.28), rgba(243, 199, 140, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.08);
      filter: blur(0.2px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 24px 60px rgba(0, 0, 0, 0.24);
      animation: floatOrb 8s ease-in-out infinite;
    }

    .hero-orb::after {
      content: "";
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      opacity: 0.5;
      animation: pulseRing 3.2s ease-out infinite;
    }

    @keyframes floatOrb {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-12px) scale(1.03);
      }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.88);
        opacity: 0.5;
      }
      100% {
        transform: scale(1.15);
        opacity: 0;
      }
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .hero-meta .meta-card,
    .glass-card,
    .module-card,
    .room-card,
    .diagnostic-card,
    .reveal-card {
      position: relative;
      border-radius: var(--radius-lg);
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 50%),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .meta-card strong,
    .glass-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 0.98rem;
    }

    .identity-grid,
    .dossier-grid,
    .lab-grid,
    .room-grid {
      display: grid;
      gap: 14px;
    }

    .confirm-row {
      display: grid;
      gap: 10px;
    }

    .confirm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .confirm-label {
      font-size: 1rem;
      color: var(--text);
    }

    .confirm-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .signal-strip {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 22px;
      background:
        radial-gradient(circle at top, rgba(130, 217, 210, 0.12), transparent 32%),
        rgba(7, 16, 28, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .signal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .signal-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: #fff7ea;
    }

    .signal-track {
      display: flex;
      gap: 10px;
    }

    .signal-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 260ms var(--ease), background 260ms var(--ease), box-shadow 260ms var(--ease);
    }

    .signal-dot.is-live {
      transform: scale(1.08);
      background: linear-gradient(135deg, rgba(243, 199, 140, 0.98), rgba(255, 244, 223, 0.98));
      box-shadow: 0 0 18px rgba(243, 199, 140, 0.34);
    }

    .signal-status {
      color: rgba(247, 244, 238, 0.84);
      line-height: 1.9;
      font-size: 0.94rem;
    }

    .choice-chip,
    .token,
    .atmosphere-card,
    .room-selector {
      min-height: 72px;
      padding: 14px;
      border-radius: var(--radius-md);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 42%),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: right;
      color: var(--text);
      transition:
        transform 320ms var(--ease-soft),
        box-shadow 320ms var(--ease-soft),
        background 320ms var(--ease),
        border-color 320ms var(--ease);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .choice-chip:hover,
    .token:hover,
    .atmosphere-card:hover,
    .room-selector:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.18);
    }

    .choice-chip.is-selected,
    .token.is-selected,
    .atmosphere-card.is-selected,
    .room-selector.is-selected {
      background:
        linear-gradient(135deg, rgba(243, 199, 140, 0.18), rgba(130, 217, 210, 0.15)),
        rgba(255, 255, 255, 0.06);
      border-color: rgba(243, 199, 140, 0.34);
      transform: translateY(-4px);
      box-shadow: 0 20px 36px rgba(0, 0, 0, 0.22);
    }

    .choice-chip .tiny,
    .token .tiny,
    .atmosphere-card .tiny,
    .room-selector .tiny {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .dossier-row {
      display: grid;
      gap: 10px;
    }

    .metric-line {
      display: grid;
      gap: 8px;
    }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .metric-track {
      position: relative;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .metric-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--fill, 50%);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(130, 217, 210, 0.9), rgba(243, 199, 140, 0.92));
      box-shadow: 0 0 24px rgba(243, 199, 140, 0.18);
      animation: fillGrow 900ms var(--ease-soft);
    }

    @keyframes fillGrow {
      from {
        width: 0;
      }
      to {
        width: var(--fill, 50%);
      }
    }

    .message-stage {
      display: grid;
      gap: 16px;
    }

    .message-card {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 55%),
        rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      min-height: 220px;
    }

    .message-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(243, 199, 140, 0.12), transparent 28%),
        linear-gradient(120deg, transparent 0 40%, rgba(255, 255, 255, 0.05) 48%, transparent 56%);
      pointer-events: none;
    }

    .message-index {
      position: relative;
      z-index: 1;
      color: var(--gold);
      font-size: 0.82rem;
    }

    .message-text {
      position: relative;
      z-index: 1;
      font-size: 1.05rem;
      line-height: 2;
      color: rgba(247, 244, 238, 0.86);
    }

    .message-echo {
      position: relative;
      z-index: 1;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(247, 244, 238, 0.72);
      line-height: 1.8;
      font-size: 0.92rem;
    }

    .message-trail {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .message-trail span {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message-trail span.is-active {
      background: linear-gradient(135deg, rgba(130, 217, 210, 0.94), rgba(243, 199, 140, 0.94));
      box-shadow: 0 0 16px rgba(130, 217, 210, 0.24);
    }

    .module-card {
      display: grid;
      gap: 12px;
    }

    .module-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .module-title {
      font-family: var(--font-display);
      font-size: 1.26rem;
      color: #fff7ea;
    }

    .token-grid,
    .atmosphere-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stabilize-chamber {
      display: grid;
      gap: 14px;
      padding: 16px;
      border-radius: 22px;
      background:
        radial-gradient(circle at top, rgba(130, 217, 210, 0.12), transparent 30%),
        rgba(6, 14, 25, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pulse-button {
      position: relative;
      min-height: 170px;
      border-radius: 28px;
      background:
        radial-gradient(circle at center, rgba(243, 199, 140, 0.08), transparent 32%),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      padding: 18px;
      overflow: hidden;
    }

    .pulse-button::before,
    .pulse-button::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .pulse-button::before {
      width: 118px;
      height: 118px;
      background:
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.2), transparent 36%),
        linear-gradient(135deg, rgba(243, 199, 140, 0.2), rgba(130, 217, 210, 0.18));
      box-shadow: 0 0 42px rgba(243, 199, 140, 0.16);
    }

    .pulse-button::after {
      width: 138px;
      height: 138px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      opacity: 0.4;
    }

    .pulse-button.is-live::after {
      animation: pulseRing 1.4s ease-out infinite;
    }

    .pulse-button.is-done::before {
      box-shadow: 0 0 48px rgba(130, 217, 210, 0.24);
      background:
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.26), transparent 36%),
        linear-gradient(135deg, rgba(130, 217, 210, 0.3), rgba(243, 199, 140, 0.18));
    }

    .pulse-core {
      position: relative;
      z-index: 1;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.8) 0 16%, transparent 18%),
        linear-gradient(140deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .pulse-button.is-live .pulse-core {
      animation: orbBeat 1s ease-in-out infinite;
    }

    @keyframes orbBeat {
      0%,
      100% {
        transform: scale(0.96);
      }
      50% {
        transform: scale(1.06);
      }
    }

    .pulse-caption {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      display: block;
      max-width: 240px;
      text-align: center;
      color: #fff4df;
      line-height: 1.9;
      font-size: 0.96rem;
    }

    .breath-meter {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .breath-meter span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(130, 217, 210, 0.92), rgba(243, 199, 140, 0.92));
      box-shadow: 0 0 22px rgba(243, 199, 140, 0.18);
      transition: width 140ms linear;
    }

    .stability-status {
      color: rgba(247, 244, 238, 0.78);
      font-size: 0.92rem;
      line-height: 1.9;
    }

    .sea-stage {
      position: relative;
      min-height: 380px;
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(245, 220, 169, 0.22), transparent 18%),
        linear-gradient(180deg, rgba(15, 28, 52, 0.96), rgba(6, 18, 34, 0.96) 48%, rgba(4, 10, 20, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 30px 80px rgba(0, 0, 0, 0.26);
    }

    .sea-stage::before {
      content: "";
      position: absolute;
      inset: auto 0 28% 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 240, 211, 0.45), transparent);
      opacity: 0.8;
    }

    .moon {
      position: absolute;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.92), rgba(243, 199, 140, 0.88) 52%, rgba(243, 199, 140, 0.06) 72%);
      box-shadow: 0 0 40px rgba(243, 199, 140, 0.28);
    }

    .moon-touch {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      width: 102px;
      height: 102px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      padding: 0;
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: 42px calc(50% - 2px) auto;
      width: 4px;
      height: 150px;
      background: linear-gradient(180deg, rgba(255, 241, 210, 0.52), transparent);
      filter: blur(3px);
    }

    .wave {
      position: absolute;
      inset-inline: -8%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(130, 217, 210, 0.18), rgba(130, 217, 210, 0.04));
      border: 1px solid rgba(130, 217, 210, 0.18);
      animation: waveDrift linear infinite;
    }

    .wave.wave-1 {
      height: 170px;
      bottom: 6%;
      animation-duration: 14s;
    }

    .wave.wave-2 {
      height: 138px;
      bottom: -2%;
      opacity: 0.8;
      animation-duration: 19s;
      animation-direction: reverse;
    }

    .wave.wave-3 {
      height: 118px;
      bottom: -9%;
      opacity: 0.65;
      animation-duration: 24s;
    }

    @keyframes waveDrift {
      from {
        transform: translateX(-3%);
      }
      to {
        transform: translateX(3%);
      }
    }

    .sea-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      padding: 18px;
      gap: 10px;
      pointer-events: none;
    }

    .sea-node,
    .sea-shell,
    .reflection-touch {
      pointer-events: auto;
      border: 0;
      background: transparent;
      padding: 0;
    }

    .sea-node {
      justify-self: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.95) 0 24%, transparent 26%),
        linear-gradient(0deg, transparent 0 43%, rgba(255, 255, 255, 0.72) 44% 56%, transparent 57%),
        linear-gradient(90deg, transparent 0 43%, rgba(255, 255, 255, 0.72) 44% 56%, transparent 57%);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.24));
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .sea-node:nth-child(2) {
      margin-top: 26px;
      animation-delay: 300ms;
    }

    .sea-node:nth-child(3) {
      margin-top: 70px;
      animation-delay: 640ms;
    }

    @keyframes twinkle {
      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .sea-floor {
      position: absolute;
      inset: auto 18px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sea-shell {
      min-width: 84px;
      min-height: 54px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 0.86rem;
    }

    .reflection-touch {
      min-height: 54px;
      padding: 0 18px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(243, 199, 140, 0.18), rgba(130, 217, 210, 0.14)),
        rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(243, 199, 140, 0.22);
      color: #fff4df;
    }

    .horizon-touch {
      position: absolute;
      inset: auto 12% 24% 12%;
      height: 36px;
      border: 0;
      background: transparent;
    }

    .sea-whisper {
      position: absolute;
      inset: auto 18px 92px 18px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(6, 14, 25, 0.26);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(247, 244, 238, 0.82);
      line-height: 1.8;
      font-size: 0.9rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .fragment-card,
    .room-stage,
    .humor-display,
    .decode-card,
    .secret-card,
    .ending-card {
      border-radius: 24px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 54%),
        rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .room-stage {
      position: relative;
      min-height: 240px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 240, 211, 0.14), transparent 18%),
        linear-gradient(180deg, rgba(14, 25, 46, 0.98), rgba(7, 16, 28, 0.96));
    }

    .room-stage::before,
    .room-stage::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .room-stage::before {
      inset: auto 10% 12% 10%;
      height: 42%;
      border-radius: 24px 24px 0 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .room-stage::after {
      width: 46%;
      height: 46%;
      top: 16%;
      right: 12%;
      border-radius: 20px;
      background: radial-gradient(circle, rgba(243, 199, 140, 0.18), transparent 68%);
      filter: blur(8px);
    }

    .room-stage.room-sea-balcony {
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 240, 211, 0.18), transparent 18%),
        linear-gradient(180deg, rgba(8, 24, 44, 0.98), rgba(5, 15, 28, 0.96));
    }

    .room-stage.room-rain-window {
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.08), transparent 18%),
        linear-gradient(180deg, rgba(17, 24, 39, 0.98), rgba(9, 14, 24, 0.96));
    }

    .room-stage.room-rain-window::after {
      background:
        repeating-linear-gradient(
          100deg,
          rgba(255, 255, 255, 0.08) 0 2px,
          transparent 3px 16px
        );
      filter: blur(0);
      opacity: 0.24;
    }

    .room-stage.room-soft-desk {
      background:
        radial-gradient(circle at 70% 24%, rgba(243, 199, 140, 0.18), transparent 18%),
        linear-gradient(180deg, rgba(23, 25, 40, 0.98), rgba(10, 13, 24, 0.96));
    }

    .room-stage.room-city-corner {
      background:
        radial-gradient(circle at 55% 16%, rgba(255, 240, 211, 0.12), transparent 18%),
        linear-gradient(180deg, rgba(10, 15, 28, 0.98), rgba(4, 9, 18, 0.96));
    }

    .room-whisper {
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff5e5;
      line-height: 1.85;
      font-size: 0.92rem;
    }

    .room-detail-button {
      align-self: start;
      margin-top: 6px;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(243, 199, 140, 0.16), rgba(130, 217, 210, 0.12)),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(243, 199, 140, 0.22);
      color: #fff5e5;
      transition: transform 280ms var(--ease-soft), box-shadow 280ms var(--ease-soft);
    }

    .room-detail-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 26px rgba(0, 0, 0, 0.18);
    }

    .room-copy {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      padding-top: 24px;
    }

    .diagnostic-card {
      display: grid;
      gap: 14px;
    }

    .humor-display {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.45rem;
      line-height: 1.8;
      color: #fff4df;
      background:
        radial-gradient(circle at top, rgba(243, 199, 140, 0.1), transparent 26%),
        rgba(255, 255, 255, 0.05);
    }

    .decode-card {
      display: grid;
      gap: 16px;
    }

    .decode-orb {
      --progress: 0deg;
      width: min(60vw, 210px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(7, 16, 30, 0.96) 0 52%, transparent 53%),
        conic-gradient(
          from -90deg,
          rgba(243, 199, 140, 0.92),
          rgba(130, 217, 210, 0.92) var(--progress),
          rgba(255, 255, 255, 0.08) var(--progress),
          rgba(255, 255, 255, 0.08)
        );
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 28px 70px rgba(0, 0, 0, 0.24);
    }

    .decode-center {
      width: 72%;
      text-align: center;
    }

    .decode-percent {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 9vw, 3.8rem);
      line-height: 1;
      color: #fff4df;
    }

    .decode-label {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .decode-log {
      display: grid;
      gap: 10px;
    }

    .decode-line {
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
      transform: translateY(10px);
      opacity: 0;
      animation: lineIn 360ms var(--ease) forwards;
    }

    @keyframes lineIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .final-title {
      font-size: clamp(2.2rem, 7vw, 3rem);
    }

    .final-message {
      display: grid;
      gap: 14px;
      font-size: 1.08rem;
      line-height: 2;
      color: rgba(247, 244, 238, 0.88);
    }

    .final-message span {
      display: block;
    }

    .final-aside {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 20px;
      background:
        radial-gradient(circle at top, rgba(130, 217, 210, 0.1), transparent 34%),
        rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .final-aside strong {
      display: block;
      margin-bottom: 8px;
      color: #fff7ea;
      font-size: 0.95rem;
    }

    .view.scene-sea .screen-card,
    .view.scene-rooms .screen-card,
    .view.scene-final .screen-card,
    .view.scene-secret .screen-card {
      animation-duration: 940ms;
    }

    .summary-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .summary-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 0.9rem;
    }

    .signature {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff5e4;
      line-height: 1.9;
    }

    .secret-card {
      text-align: center;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(circle at top, rgba(130, 217, 210, 0.14), transparent 24%),
        linear-gradient(180deg, rgba(9, 21, 37, 0.92), rgba(6, 14, 24, 0.96));
    }

    .constellation {
      position: relative;
      width: min(62vw, 240px);
      height: 180px;
      margin: 0 auto;
    }

    .constellation span {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.94), rgba(243, 199, 140, 0.14));
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.24);
    }

    .constellation::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0 22%, rgba(255, 255, 255, 0.12) 23% 24%, transparent 25% 48%, rgba(255, 255, 255, 0.12) 49% 50%, transparent 51%);
      opacity: 0.44;
    }

    .action-stack {
      display: grid;
      gap: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translate(-50%, 26px);
      width: min(calc(100% - 26px), 420px);
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(8, 17, 31, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      color: var(--text);
      opacity: 0;
      transition: opacity 280ms var(--ease), transform 280ms var(--ease);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body[data-scene="intro"] {
      background:
        radial-gradient(circle at top, rgba(130, 217, 210, 0.2), transparent 26%),
        radial-gradient(circle at 80% 10%, rgba(243, 199, 140, 0.16), transparent 22%),
        linear-gradient(180deg, #07101d, #081a2d 50%, #06111d);
    }

    body[data-scene="identify"] {
      background:
        radial-gradient(circle at 16% 10%, rgba(130, 217, 210, 0.16), transparent 22%),
        radial-gradient(circle at 82% 8%, rgba(243, 199, 140, 0.12), transparent 20%),
        linear-gradient(180deg, #07101c, #0b182a 52%, #07111e);
    }

    body[data-scene="future"] {
      background:
        radial-gradient(circle at 22% 12%, rgba(130, 217, 210, 0.14), transparent 24%),
        radial-gradient(circle at 78% 10%, rgba(243, 199, 140, 0.14), transparent 20%),
        linear-gradient(180deg, #08101d, #0c1b30 54%, #07111c);
    }

    body[data-scene="sea"],
    body[data-scene="secret"] {
      background:
        radial-gradient(circle at top, rgba(90, 151, 199, 0.2), transparent 26%),
        radial-gradient(circle at 76% 12%, rgba(243, 199, 140, 0.1), transparent 18%),
        linear-gradient(180deg, #050c17, #081628 54%, #030912);
    }

    body[data-scene="final"] {
      background:
        radial-gradient(circle at top, rgba(243, 199, 140, 0.16), transparent 24%),
        radial-gradient(circle at 18% 14%, rgba(130, 217, 210, 0.16), transparent 22%),
        linear-gradient(180deg, #08101d, #102034 54%, #08111d);
    }

    body[data-scene="rooms"] {
      background:
        radial-gradient(circle at 18% 10%, rgba(130, 217, 210, 0.14), transparent 22%),
        radial-gradient(circle at 84% 12%, rgba(255, 236, 201, 0.1), transparent 18%),
        linear-gradient(180deg, #08101c, #0d1a2b 54%, #08111b);
    }

    body[data-scene="humor"] {
      background:
        radial-gradient(circle at 50% 0%, rgba(243, 199, 140, 0.12), transparent 22%),
        radial-gradient(circle at 14% 16%, rgba(130, 217, 210, 0.1), transparent 20%),
        linear-gradient(180deg, #07101b, #0b1626 54%, #06101a);
    }

    body[data-scene="reconstruct"] {
      background:
        radial-gradient(circle at 50% 8%, rgba(130, 217, 210, 0.18), transparent 22%),
        radial-gradient(circle at 74% 16%, rgba(243, 199, 140, 0.12), transparent 20%),
        linear-gradient(180deg, #06101d, #0a182c 54%, #08111d);
    }

    @media (max-width: 560px) {
      .screen-card {
        padding: 20px;
      }

      .hero-meta,
      .confirm-options,
      .token-grid,
      .atmosphere-grid {
        grid-template-columns: 1fr;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .sea-floor {
        flex-direction: column;
        align-items: stretch;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="ambientGrid" class="ambient-grid" aria-hidden="true"></div>
  <div id="particleLayer" class="particle-layer" aria-hidden="true"></div>
  <div id="glowLayer" class="glow-layer" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hud" id="hud">
      <div class="hud-mark" id="hudMark"></div>
      <div class="hud-copy">
        <div class="hud-title" id="hudTitle"></div>
        <div class="hud-subtitle" id="hudSubtitle"></div>
      </div>
      <div class="hud-progress" id="hudProgress"></div>
    </header>

    <section class="view-frame" id="viewFrame"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const CONFIG = {
      recipientName: "دنيا",
      gameTitle: "إشارة من دنيا القادمة",
      subtitle: "نسخة هادية ومخفية من يوم أحسن شوية",
      insideJokePlaceholder: "",
      signatureLine: "من النسخة اللي جاية من قدّام شوية... واللي لسه عندها ذوق وحنية كفاية تدلّع دنيا لما تحتاج.",

    const Utils = {
      format(template, values) {
        return template.replace(/\{\{(.*?)\}\}/g, (_, key) => values[key.trim()] ?? "");
      },
      clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      },
      sample(list) {
        return list[Math.floor(Math.random() * list.length)];
      },
      shuffle(list) {
        const clone = [...list];
        for (let index = clone.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [clone[index], clone[swapIndex]] = [clone[swapIndex], clone[index]];
        }
        return clone;
      },
      wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      },
      showToast(message) {
        dom.toast.textContent = message;
        dom.toast.classList.add("is-visible");
        clearTimeout(appState.toastTimer);
        appState.toastTimer = setTimeout(() => {
          dom.toast.classList.remove("is-visible");
        }, 2200);
      },
      invalidateGeneratedState({ clearRoomDetail = false } = {}) {
        appState.reconstructionRunning = false;
        appState.reconstructionDone = false;
        appState.reconstructionPercent = 0;
        appState.reconstructionLogs = [];
        appState.finalMessage = "";
        appState.finalAside = "";
        appState.finalShortLine = "";
        if (clearRoomDetail) {
          appState.roomDetailNote = "";
        }
      },
      createParticles() {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const count = reducedMotion ? 10 : 22;
        const fragment = document.createDocumentFragment();

        for (let index = 0; index < count; index += 1) {
          const particle = document.createElement("span");
          const size = 2 + Math.random() * 4;
          particle.className = "particle";
          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.bottom = `${-10 - Math.random() * 80}px`;
          particle.style.animationDuration = `${12 + Math.random() * 14}s`;
          particle.style.animationDelay = `${Math.random() * 12}s`;
          fragment.appendChild(particle);
        }

        dom.particleLayer.appendChild(fragment);
      }
    };

    const ScreenManager = {
      list: CONFIG.journey.map((item) => item.id),
      get currentIndex() {
        return this.list.indexOf(appState.currentScreen);
      },
      go(screenId) {
        if (!this.list.includes(screenId)) return;
        clearInterval(appState.stabilityHoldTimer);
        appState.stabilityHoldTimer = null;
        appState.stabilityHoldActive = false;
        appState.currentScreen = screenId;
        SceneRenderer.render();
      },
      next() {
        const nextId = this.list[this.currentIndex + 1];
        if (nextId) this.go(nextId);
      },
      reset() {
        clearInterval(appState.stabilityHoldTimer);
        appState.currentScreen = "intro";
        appState.identity = {};
        appState.futureMessageIndex = 0;
        appState.calmAtmosphere = "";
        appState.lightThings = [];
        appState.signalStability = 18;
        appState.stabilityHoldDone = false;
        appState.stabilityHoldActive = false;
        appState.stabilityHoldTimer = null;
        appState.humorLine = HumorCommentSystem.random();
        appState.roomId = "sea-balcony";
        appState.visitedRoomIds = ["sea-balcony"];
        appState.openedRoomDetailIds = [];
        appState.roomDetailNote = "";
        appState.foundStarIds = [];
        appState.openedShellIds = [];
        appState.touchedReflection = false;
        appState.touchedMoon = false;
        appState.touchedHorizon = false;
        appState.seaWhisper = CONFIG.sea.whisperIntro;
        appState.fragmentNotes = [];
        appState.reconstructionRunning = false;
        appState.reconstructionDone = false;
        appState.reconstructionPercent = 0;
        appState.reconstructionLogs = [];
        appState.finalMessage = "";
        appState.finalAside = "";
        appState.finalShortLine = "";
        appState.secretUnlocked = false;
        appState.viewSeed = Math.random();
        SceneRenderer.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };

    const FutureMessageSystem = {
      next() {
        appState.futureMessageIndex = Utils.clamp(
          appState.futureMessageIndex + 1,
          0,
          CONFIG.future.messages.length - 1
        );
        SceneRenderer.render();
      },
      complete() {
        return appState.futureMessageIndex >= CONFIG.future.messages.length - 1;
      }
    };

    const HumorCommentSystem = {
      random() {
        return Utils.sample(CONFIG.humor.lines);
      },
      roll() {
        appState.humorLine = this.random();
        SceneRenderer.render();
      }
    };

    const HiddenEndingTrigger = {
      check() {
        appState.secretUnlocked =
          appState.foundStarIds.includes("star-2") &&
          appState.touchedReflection &&
          appState.touchedMoon &&
          appState.stabilityHoldDone &&
          appState.visitedRoomIds.length >= 2 &&
          appState.lightThings.length === 3;
        return appState.secretUnlocked;
      }
    };

    const FinalMessageGenerator = {
      generate() {
        const atmosphere =
          CONFIG.lab.atmospheres.find((item) => item.id === appState.calmAtmosphere)?.title ||
          CONFIG.lab.atmospheres[0].title;
        const picks = appState.lightThings.length ? appState.lightThings : CONFIG.lab.lighterPool.slice(0, 3).map((item) => item.title);
        const room =
          CONFIG.rooms.rooms.find((item) => item.id === appState.roomId)?.title ||
          CONFIG.rooms.rooms[0].title;
        const shortTemplate = Utils.sample(CONFIG.final.shortTemplates);
        const opening = Utils.sample(CONFIG.final.openingTemplates);
        const ambition = Utils.sample(CONFIG.final.ambitionTemplates);
        const restore = Utils.format(Utils.sample(CONFIG.final.restoreTemplates), {
          name: CONFIG.recipientName,
          atmosphere,
          room,
          lighterA: picks[0] || "",
          lighterB: picks[1] || "",
          lighterC: picks[2] || ""
        });
        const seaLine = Utils.sample(CONFIG.final.seaTemplates);
        const close = Utils.sample(CONFIG.final.closeTemplates);
        const asideSource =
          appState.roomDetailNote ||
          appState.fragmentNotes[0] ||
          CONFIG.rooms.rooms.find((item) => item.id === appState.roomId)?.whisper ||
          Utils.sample(CONFIG.final.asideTemplates);

        appState.finalMessage = [opening, ambition, restore, seaLine, close]
          .map((line) => `<span>${line}</span>`)
          .join("");
        appState.finalAside = asideSource;

        if (CONFIG.insideJokePlaceholder) {
          appState.finalMessage = `${appState.finalMessage}<span>${CONFIG.insideJokePlaceholder}</span>`;
        }

        appState.finalShortLine = Utils.format(shortTemplate, {
          name: CONFIG.recipientName,
          atmosphere
        });
      }
    };

    const InteractionModules = {
      identity: {
        choose(group, value) {
          appState.identity[group] = value;
          SceneRenderer.render();
        },
        isReady() {
          return CONFIG.identify.rows.every((row) => appState.identity[row.key] === row.correct);

        progressCount() {
          return CONFIG.identify.rows.filter((row) => appState.identity[row.key] === row.correct).length;

          return CONFIG.identify.statusLines[this.progressCount()] || CONFIG.identify.statusLines[0];

      lab: {
        chooseAtmosphere(id) {
          appState.calmAtmosphere = id;
          Utils.invalidateGeneratedState();
          SceneRenderer.render();
        },
        toggleThing(id) {
          const found = CONFIG.lab.lighterPool.find((item) => item.id === id);
          if (!found) return;

          if (appState.lightThings.includes(found.title)) {
            appState.lightThings = appState.lightThings.filter((item) => item !== found.title);
          } else if (appState.lightThings.length < 3) {
            appState.lightThings = [...appState.lightThings, found.title];
          } else {
            Utils.showToast(CONFIG.ui.chooseThree);
          }

          HiddenEndingTrigger.check();
          Utils.invalidateGeneratedState();
          SceneRenderer.render();
        },
        refreshStabilityUI() {
          const valueEl = dom.viewFrame.querySelector("[data-stability-value]");
          const statusEl = dom.viewFrame.querySelector("[data-stability-status]");
          const buttonEl = dom.viewFrame.querySelector("[data-lab-continue]");
          const meterEl = dom.viewFrame.querySelector("[data-breath-meter]");
          const pulseEl = dom.viewFrame.querySelector("[data-hold-button]");
          const captionEl = dom.viewFrame.querySelector("[data-hold-caption]");

          if (valueEl) valueEl.textContent = `${Math.round(appState.signalStability)}%`;
          if (statusEl) statusEl.textContent = this.statusText();
          if (buttonEl) buttonEl.disabled = !this.canContinue();
          if (meterEl) meterEl.style.width = `${Math.round(appState.signalStability)}%`;
          if (pulseEl) {
            pulseEl.classList.toggle("is-live", appState.stabilityHoldActive);
            pulseEl.classList.toggle("is-done", appState.stabilityHoldDone);
          }
          if (captionEl) captionEl.textContent = this.holdCaption();
        },
        startStabilityHold() {
          if (appState.stabilityHoldDone || appState.stabilityHoldActive) return;

          clearInterval(appState.stabilityHoldTimer);
          appState.stabilityHoldActive = true;
          this.refreshStabilityUI();

          appState.stabilityHoldTimer = setInterval(() => {
            appState.signalStability = Utils.clamp(appState.signalStability + 4.2, 18, 100);
            this.refreshStabilityUI();

            if (appState.signalStability >= 100) {
              clearInterval(appState.stabilityHoldTimer);
              appState.stabilityHoldTimer = null;
              appState.stabilityHoldDone = true;
              appState.stabilityHoldActive = false;
              Utils.invalidateGeneratedState();
              Utils.showToast(CONFIG.ui.pulseDone);
              HiddenEndingTrigger.check();
              this.refreshStabilityUI();
            }
          }, 70);
        },
        stopStabilityHold() {
          if (!appState.stabilityHoldActive) return;

          clearInterval(appState.stabilityHoldTimer);
          appState.stabilityHoldTimer = null;
          appState.stabilityHoldActive = false;

          if (!appState.stabilityHoldDone) {
            appState.signalStability = Utils.clamp(appState.signalStability - 14, 18, 100);
          }

          this.refreshStabilityUI();
        },
        canContinue() {
          return (
            !!appState.calmAtmosphere &&
            appState.lightThings.length === 3 &&
            appState.stabilityHoldDone
          );
        },
        holdCaption() {
          if (appState.stabilityHoldDone) return CONFIG.lab.holdDone;
          if (appState.stabilityHoldActive) return CONFIG.lab.holdActive;
          return CONFIG.lab.holdIdle;
        },
        statusText() {
          if (appState.stabilityHoldDone || appState.signalStability >= 88) return CONFIG.lab.statusHigh;
          if (appState.signalStability >= 48) return CONFIG.lab.statusMid;
          return CONFIG.lab.statusLow;
        }
      },

          const target = CONFIG.sea.stars.find((item) => item.id === id);

          appState.seaWhisper = target.reveal;
          appState.fragmentNotes = [target.reveal, ...appState.fragmentNotes].slice(0, 5);

          SceneRenderer.render();

          HiddenEndingTrigger.check();

          if (!appState.touchedMoon) {
            appState.touchedMoon = true;

            appState.fragmentNotes = [CONFIG.sea.moonReveal, ...appState.fragmentNotes].slice(0, 5);

          SceneRenderer.render();

      rooms: {
        select(id) {
          appState.roomId = id;
          if (!appState.visitedRoomIds.includes(id)) {
            appState.visitedRoomIds = [...appState.visitedRoomIds, id];
          }
          Utils.invalidateGeneratedState({ clearRoomDetail: true });
          HiddenEndingTrigger.check();
          SceneRenderer.render();
        },
        randomize() {
          appState.roomId = Utils.sample(CONFIG.rooms.rooms).id;
          if (!appState.visitedRoomIds.includes(appState.roomId)) {
            appState.visitedRoomIds = [...appState.visitedRoomIds, appState.roomId];
          }
          Utils.invalidateGeneratedState({ clearRoomDetail: true });
          HiddenEndingTrigger.check();
          SceneRenderer.render();
        },
        openDetail(id) {
          const room = CONFIG.rooms.rooms.find((item) => item.id === id);
          if (!room) return;

          appState.roomId = id;
          appState.roomDetailNote = room.detailReveal;
          if (!appState.visitedRoomIds.includes(id)) {
            appState.visitedRoomIds = [...appState.visitedRoomIds, id];
          }
          if (!appState.openedRoomDetailIds.includes(id)) {
            appState.openedRoomDetailIds = [...appState.openedRoomDetailIds, id];
            appState.fragmentNotes = [room.detailReveal, ...appState.fragmentNotes].slice(0, 5);
            Utils.showToast(CONFIG.ui.roomDetailFound);
          }
          Utils.invalidateGeneratedState();
          HiddenEndingTrigger.check();
          SceneRenderer.render();
        }
      },
      replay: {
        copyShortLine() {
          const text = appState.finalShortLine || CONFIG.final.footer;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(
              () => Utils.showToast(CONFIG.ui.copied),
              () => Utils.showToast(CONFIG.ui.copied)

                  <h2 class="section-title">${CONFIG.replay.title}</h2>
                  <p class="copy">${CONFIG.replay.copy}</p>
                  <div class="pill-row" style="margin-top:18px;">
                    <span class="pill">${CONFIG.recipientName}</span>
                    <span class="pill">${appState.finalShortLine}</span>
                  </div>
                </div>
                <div class="action-stack">
                  <button class="btn" data-action="restart">${CONFIG.replay.replay}</button>
                  <button class="btn-soft" data-action="another-world">${CONFIG.replay.anotherWorld}</button>
                  <button class="btn-soft" data-action="go-secret">${CONFIG.replay.secret}</button>
                  <button class="btn-soft" data-action="regenerate">${CONFIG.replay.regenerate}</button>
                  <button class="btn-ghost" data-action="copy-short">${CONFIG.replay.copyShort}</button>
                </div>
              </div>
            </section>
          `;
        }
      }
    };

    const ReconstructionEngine = {
      async start() {
        const atmosphere =
          CONFIG.lab.atmospheres.find((item) => item.id === appState.calmAtmosphere)?.title ||
          CONFIG.lab.atmospheres[0].title;
        const picks = appState.lightThings.length ? appState.lightThings : CONFIG.lab.lighterPool.slice(0, 3).map((item) => item.title);
        const room =
          CONFIG.rooms.rooms.find((item) => item.id === appState.roomId)?.label ||
          CONFIG.rooms.rooms[0].label;
        const stepLines = CONFIG.reconstruct.steps.map((step) =>
          Utils.format(step, {
            atmosphere,
            room,
            lighterA: picks[0] || "",
            lighterB: picks[1] || "",
            lighterC: picks[2] || ""
          })
        );

        appState.reconstructionRunning = true;
        appState.reconstructionDone = false;
        appState.reconstructionPercent = 0;
        appState.reconstructionLogs = [];
        SceneRenderer.render();

        for (let index = 0; index < stepLines.length; index += 1) {
          await Utils.wait(760);
          appState.reconstructionPercent = Math.round(((index + 1) / stepLines.length) * 100);
          appState.reconstructionLogs = [...appState.reconstructionLogs, stepLines[index]];
          SceneRenderer.render();
        }

        appState.reconstructionRunning = false;
        appState.reconstructionDone = true;
        SceneRenderer.render();
      }
    };

    dom.viewFrame.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;

      const { action, target: screenTarget, value, group } = target.dataset;

      switch (action) {
        case "go":
          ScreenManager.go(screenTarget);
          break;
        case "identity":
          InteractionModules.identity.choose(group, value);
          break;
        case "future-next":
          FutureMessageSystem.next();
          break;
        case "atmosphere":
          InteractionModules.lab.chooseAtmosphere(value);
          break;
        case "lighter":
          InteractionModules.lab.toggleThing(value);
          break;
        case "star":
          InteractionModules.sea.openStar(value);
          break;
        case "shell":
          InteractionModules.sea.openShell(value);
          break;
        case "reflection":
          InteractionModules.sea.touchReflection();
          break;
        case "moon":
          InteractionModules.sea.touchMoon();
          break;
        case "horizon":
          InteractionModules.sea.touchHorizon();
          break;
        case "room":
          InteractionModules.rooms.select(value);
          break;
        case "room-detail":
          InteractionModules.rooms.openDetail(value);
          break;
        case "humor-roll":
          HumorCommentSystem.roll();
          break;
        case "copy-short":
          InteractionModules.replay.copyShortLine();
          break;
        case "restart":
          ScreenManager.reset();
          break;
        case "another-world":
          InteractionModules.rooms.randomize();
          ScreenManager.go("rooms");
          break;
        case "go-secret":
          if (HiddenEndingTrigger.check()) {
            ScreenManager.go("secret");
          } else {
            Utils.showToast(CONFIG.ui.secretLocked);
          }
          break;
        case "regenerate":
          FinalMessageGenerator.generate();
          SceneRenderer.render();
          break;
        case "toast-secret":
          Utils.showToast(CONFIG.ui.secretHint);
          break;
        default:
          break;
      }
    });

    dom.viewFrame.addEventListener("pointerdown", (event) => {
      const target = event.target.closest("[data-action='hold-stability']");
      if (!target) return;
      InteractionModules.lab.startStabilityHold();
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach((eventName) => {
      dom.viewFrame.addEventListener(eventName, () => {
        InteractionModules.lab.stopStabilityHold();
      });
    });

    ["pointerup", "pointercancel"].forEach((eventName) => {
      window.addEventListener(eventName, () => {
        InteractionModules.lab.stopStabilityHold();
      });
    });

    Utils.createParticles();
    appState.humorLine = HumorCommentSystem.random();
    appState.seaWhisper = CONFIG.sea.whisperIntro;
    FinalMessageGenerator.generate();
    SceneRenderer.render();
  </script>
</body>
</html>
